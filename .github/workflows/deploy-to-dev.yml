# .github/workflows/deploy-to-dev.yml
name: Deploy to Dev Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: 'Deploy note (e.g. what changed)'
        required: false
        default: 'Manual deploy to dev'

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    # Safety guard: "Run workflow" in the Actions tab lets you pick any branch.
    # Only main may deploy to the dev server, so a manual run from
    # feature/itinerary (or any other branch) is skipped instead of
    # overwriting dev with that branch's files.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Apex_dev repo
        uses: actions/checkout@v4

      - name: FTP Deploy to Dev Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DEV_SERVER_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            *.md
            config.php
